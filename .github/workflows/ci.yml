name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - name: Build, unit + scenario tests, end-to-end, QNX type-check
        run: make WERROR=1 CC=${{ matrix.cc }} check

  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ASan + UBSan
        run: >
          make WERROR=1 CC=clang BUILD=build-asan
          CFLAGS="-O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=all"
          check

  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Two-bed demo at 20% of real time
        run: make && sh scripts/demo.sh 20
      - uses: actions/upload-artifact@v4
        with:
          name: demo-out
          path: demo-out/
